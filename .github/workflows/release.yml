name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      - name: Test
        run: go test ./...
      - name: Build release binaries
        run: make dist VERSION=${GITHUB_REF_NAME}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
